name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  sast-scan:
    name: 🕵️ Análisis de Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Bandit
        run: pip install bandit

      - name: Escanear código con Bandit
        run: bandit -r . -f custom

  container-scan:
    name: 🐳 Build & Escaneo de Contenedor (SCA)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker localmente
        run: docker build -t mi-api-vulnerable:latest .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-api-vulnerable:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'